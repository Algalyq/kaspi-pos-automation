name: Build & Deploy

on:
  push:
    branches:
      - master
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: lower
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.lower.outputs.name }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Set deploy vars
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "master" ] || [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "port=8506" >> $GITHUB_OUTPUT
            echo "container=kaspi-pos-master" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "port=8507" >> $GITHUB_OUTPUT
            echo "container=kaspi-pos-${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: |
          IMAGE=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          docker pull ghcr.io/${IMAGE}:${{ steps.vars.outputs.tag }}

      - name: Stop old container
        run: |
          docker stop ${{ steps.vars.outputs.container }} || true
          docker rm ${{ steps.vars.outputs.container }} || true

      - name: Deploy container
        run: |
          docker run -d \
            --name ${{ steps.vars.outputs.container }} \
            --restart unless-stopped \
            --add-host=host.docker.internal:host-gateway \
            -p ${{ steps.vars.outputs.port }}:3001 \
            -e PORT=3001 \
            -e TOKEN_SECRET_KEY=${{ secrets.KASPI_POS_TOKEN_SECRET_KEY }} \
            -v kaspi-pos-data:/app \
            ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):${{ steps.vars.outputs.tag }}

      - name: Cleanup old images
        run: docker image prune -f || true
