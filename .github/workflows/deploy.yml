name: ci-cd

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-kaspi-pos
  cancel-in-progress: false

env:
  SERVICE: kaspi-pos
  IMAGE: ghcr.io/algalyq/kaspi-pos-automation
  PORT: "3001"
  REMOTE_DIR: /root/hostmate
  HEALTH_PATH: /health

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: copy deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "scripts/deploy.sh"
          target: ${{ env.REMOTE_DIR }}
          strip_components: 1

      # Платёжный под — внутренний сервис: живёт в hostmate-net,
      # порт биндится только на 127.0.0.1 хоста, Caddy/nаружу не публикуем.
      - name: blue-green deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            chmod +x ${{ env.REMOTE_DIR }}/deploy.sh
            docker rm -f kaspi-pos-master || true
            EXTRA_ARGS="-e DATA_DIR=/app/data -v kaspi-pos-data:/app/data -e TOKEN_SECRET_KEY=${{ secrets.KASPI_POS_TOKEN_SECRET_KEY }} -e POS_API_KEY=${{ secrets.KASPI_POS_API_KEY }} -e POS_WEBHOOK_URL=${{ secrets.KASPI_POS_WEBHOOK_URL }} -e POS_WEBHOOK_SECRET=${{ secrets.KASPI_POS_WEBHOOK_SECRET }}" HEALTH_PATH="${{ env.HEALTH_PATH }}" ${{ env.REMOTE_DIR }}/deploy.sh ${{ env.SERVICE }} "${{ env.IMAGE }}:${{ github.sha }}" ${{ env.PORT }}
